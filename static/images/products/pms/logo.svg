<svg xmlns="http://www.w3.org/2000/svg" width="340" height="96" viewBox="0 0 340 96" role="img" aria-label="PMS — Property Management System">
  <title>PMS — Property Management System</title>
  <!-- Icon chip -->
  <rect x="0" y="8" width="80" height="80" rx="20" fill="#0F766E"/>
  <!-- Two building towers (white) -->
  <rect x="20" y="36" width="18" height="36" rx="3" fill="#FFFFFF"/>
  <rect x="42" y="24" width="20" height="48" rx="3" fill="#FFFFFF"/>
  <!-- Baseline -->
  <rect x="16" y="70" width="50" height="4" rx="2" fill="#FFFFFF"/>
  <!-- Windows on left tower (teal cut-outs) -->
  <g fill="#0F766E">
    <rect x="24" y="42" width="4.5" height="4.5" rx="1"/>
    <rect x="30.5" y="42" width="4.5" height="4.5" rx="1"/>
    <rect x="24" y="50" width="4.5" height="4.5" rx="1"/>
    <rect x="30.5" y="50" width="4.5" height="4.5" rx="1"/>
    <rect x="24" y="58" width="4.5" height="4.5" rx="1"/>
    <rect x="30.5" y="58" width="4.5" height="4.5" rx="1"/>
  </g>
  <!-- Windows on right tower (teal cut-outs) -->
  <g fill="#0F766E">
    <rect x="46.5" y="30" width="5" height="5" rx="1"/>
    <rect x="53.5" y="30" width="5" height="5" rx="1"/>
    <rect x="46.5" y="39" width="5" height="5" rx="1"/>
    <rect x="53.5" y="39" width="5" height="5" rx="1"/>
    <rect x="46.5" y="48" width="5" height="5" rx="1"/>
    <rect x="53.5" y="48" width="5" height="5" rx="1"/>
    <rect x="46.5" y="57" width="5" height="5" rx="1"/>
    <rect x="53.5" y="57" width="5" height="5" rx="1"/>
  </g>
  <!-- Wordmark -->
  <text x="98" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="800" fill="#0F172A" letter-spacing="0.5">PMS</text>
  <text x="100" y="74" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0F766E" letter-spacing="2.4">PROPERTY MANAGEMENT</text>
</svg>
