<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" width="360" height="100" role="img" aria-label="Vikundi">
  <defs>
    <linearGradient id="vk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#0b5ed7"/>
    </linearGradient>
  </defs>
  <!-- emblem: a savings circle of members + growth arc -->
  <g>
    <rect x="6" y="14" width="72" height="72" rx="20" fill="url(#vk)"/>
    <!-- coin -->
    <circle cx="42" cy="50" r="20" fill="none" stroke="#ffffff" stroke-width="4"/>
    <!-- three members around the pot -->
    <circle cx="42" cy="34" r="5.5" fill="#ffffff"/>
    <circle cx="27" cy="58" r="5.5" fill="#ffffff"/>
    <circle cx="57" cy="58" r="5.5" fill="#ffffff"/>
    <!-- TZS / savings mark -->
    <path d="M36 50h12M42 44v12" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
  </g>
  <!-- wordmark -->
  <text x="92" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800" fill="#0b5ed7" letter-spacing="-1">Vikundi</text>
  <text x="94" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748b" letter-spacing="3">VICOBA MANAGEMENT</text>
</svg>
