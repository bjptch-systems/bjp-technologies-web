<!-- Cookie consent banner — shown until the visitor accepts or rejects (static/js/consent.js) -->
<div class="cookie-banner" id="cookie-banner" role="dialog" aria-live="polite"
     aria-label="Cookie consent" hidden>
    <div class="cookie-banner-inner">
        <p>
            We use cookies to understand how visitors use our website and to show our location
            on a map. You can accept or reject these. Essential cookies that keep the site secure
            are always on. <a href="{% url 'main:privacy' %}">Privacy Policy</a>
        </p>
        <div class="cookie-banner-actions">
            <button type="button" class="cookie-btn cookie-btn-accept" data-cookie-choice="accepted">Accept</button>
            <button type="button" class="cookie-btn cookie-btn-reject" data-cookie-choice="rejected">Reject</button>
        </div>
    </div>
</div>
